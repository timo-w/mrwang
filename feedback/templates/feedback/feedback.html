{% extends "base.html" %}
{% load static %}

{% block title %}Feedback{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'feedback/css/feedback.css' %}">
{% endblock %}

{% block content %}

<h1>Give Feedback</h1>

<p>Use this form to request features, report bugs, ask questions, or request your data.</p>

<form method="POST">
    <h4>Feedback Form</h4>
    {% csrf_token %}
    {{ form.as_p }}
    <button class="launch-btn" type="submit">Submit</button>
</form>

{% endblock %}
